name: Smoke install

# Fresh-install regression guard. Packs the built tarball, installs it in a clean
# directory the way a user would, and exercises the published surface:
#   1. `wave-mcp-server --version` prints the package version.
#   2. The stdio handshake + tools/list returns every tool (count asserted: 24
#      total — bump this whenever a tool is added or removed).
#   3. A live --all run calls the 18 gateway-backed tools (design tools,
#      wave_voice_converse, and wave.ask are local/propose-only and not
#      gateway routes, so --all skips them) against https://api.wave.online
#      with the repo secret and prints one row per tool. Some rows are
#      expected to fail until dependent WAVE services finish deploying (see
#      CHANGELOG); the job still asserts the tools/list count is 24 and the
#      --all row count is 18 either way.
# Step 3 skips honestly when WAVE_GATEWAY_API_KEY is absent (forks, unset).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Build and pack
        run: |
          npm ci
          npm run build
          TARBALL="$(npm pack --json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8'))[0].filename)")"
          test -f "$TARBALL"
          echo "TARBALL=$PWD/$TARBALL" >> "$GITHUB_ENV"

      - name: Fresh install from tarball
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$TARBALL" --registry=https://registry.npmjs.org
          npm ls @wave-av/mcp-server

      - name: --version prints the package version
        run: |
          cd "$RUNNER_TEMP/smoke"
          EXPECTED="$(node -p "require('./node_modules/@wave-av/mcp-server/package.json').version")"
          GOT="$(node node_modules/.bin/wave-mcp-server --version)"
          echo "expected=$EXPECTED got=$GOT"
          test "$GOT" = "$EXPECTED"

      - name: Stdio handshake and tools/list
        run: |
          cd "$RUNNER_TEMP/smoke"
          node "$GITHUB_WORKSPACE/scripts/smoke-mcp.mjs" node_modules/@wave-av/mcp-server/dist/index.js 24

      - name: Live --all against api.wave.online (all 18 tools)
        env:
          WAVE_API_KEY: ${{ secrets.WAVE_GATEWAY_API_KEY }}
        run: |
          if [ -z "$WAVE_API_KEY" ]; then
            echo "skipped: WAVE_GATEWAY_API_KEY absent (fork or unset)"
            exit 0
          fi
          cd "$RUNNER_TEMP/smoke"
          node "$GITHUB_WORKSPACE/scripts/smoke-mcp.mjs" node_modules/@wave-av/mcp-server/dist/index.js 24 --all
