name: Release (public npm)

# Gated public-release path for @wave-av/mcp-server.
#
# Trigger: pushing a `v*` git tag (e.g. `v1.0.15`). The previous `publish.yml`
# published on the same trigger with NO gate; this workflow replaces it, and
# nothing reaches public npm until three gates are green:
#   1. secret-scan — org-standard gitleaks (pinned + checksum-verified) over the
#                    published tree + the WAVE content-policy trade-secret gate.
#   2. verify      — install + lint + type-check + build, then an e2e-smoke that
#                    PACKS the real tarball, installs it into a throwaway
#                    project, and imports it -- root AND the ./sdk-server
#                    subpath. ESM only: this package ships no `require`
#                    condition, so a CJS arm would be a false failure.
#   3. publish     — only after 1+2 pass. The tag version MUST equal
#                    package.json version, and the npm dist-tag is derived from
#                    the version: any prerelease -> `next`, stable -> `latest`,
#                    so a prerelease can never take `latest` by accident.
#
# Modelled on the proven sdk/.github/workflows/release.yml, which produced the
# OIDC-published @wave-av/sdk@2.1.0-next.0. Action pins are copied from it
# deliberately: that file has demonstrably run and published.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mcp-server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — secret scan (org standard: gitleaks + WAVE content-policy).
  # Mirrors public-repo-guard.yml so the release path enforces the SAME gate the
  # merge path does; pinned version + SHA-256 so a tampered download cannot run.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: gitleaks (secret scan — published tree)
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Install ripgrep
        run: command -v rg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep)

      - name: content policy (WAVE trade-secret / internal-leak gate)
        env:
          GUARD_PRIVATE_REPOS: ${{ vars.GUARD_PRIVATE_REPOS }}
        run: bash scripts/public-repo-guard/content-policy.sh .

  # ---------------------------------------------------------------------------
  # Gate 2 — build, lint, type-check, then e2e-smoke the real tarball.
  # ---------------------------------------------------------------------------
  verify:
    name: Build + e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      # This package declares no `test` script today. Run one if it ever gains
      # one, and say plainly when it has none -- a hardcoded `npm run test`
      # would fail the gate, and silently dropping it would hide that this
      # release path has no unit-test coverage.
      - name: Unit tests (if the package declares any)
        run: |
          set -euo pipefail
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.test?0:1)"; then
            npm run test
          else
            echo "::warning title=no unit tests::package.json declares no \"test\" script - gate 2 is lint + type-check + build + e2e-smoke only"
          fi

      - run: npm run build

      - name: e2e-smoke — pack + install + import the real tarball
        run: |
          set -euo pipefail
          # --json instead of --silent: some npm versions suppress the stdout
          # filename under --silent, which would leave TARBALL empty and turn
          # the install below into an install of the workspace DIRECTORY --
          # green gate, real tarball never exercised. Parse the filename and
          # prove the .tgz exists so any regression fails loudly instead.
          TARBALL="$(npm pack --json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8'))[0].filename)")"
          case "$TARBALL" in
            *.tgz) ;;
            *) echo "::error::npm pack --json reported '$TARBALL', not a .tgz filename"; exit 1 ;;
          esac
          if [ ! -f "$TARBALL" ]; then
            echo "::error::npm pack reported '$TARBALL' but no such file exists"
            exit 1
          fi
          TARBALL="$PWD/$TARBALL"
          echo "packed: $TARBALL"
          # Disposable project, outside the workspace, with lifecycle scripts
          # disabled: this installs a freshly built artifact and we only want to
          # prove it RESOLVES, not to execute anything it ships.
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y >/dev/null 2>&1
          npm install --no-save --ignore-scripts "$TARBALL" >/dev/null 2>&1
          # ESM import of the ./sdk-server subpath -- the actual library
          # surface. ESM only: this package's exports declare `import`/`default`
          # and no `require`, so a CJS arm would fail on a correct package.
          node --input-type=module -e "import * as s from '@wave-av/mcp-server/sdk-server'; if(!s||Object.keys(s).length===0){console.error('sdk-server subpath empty');process.exit(1);} console.log('sdk-server subpath ok - exports:',Object.keys(s).length);"
          # The ROOT entry is deliberately NOT imported. It is the executable
          # (`#!/usr/bin/env node`, zero exports) and it calls
          # `server.connect(transport)` at top level -- importing it would start
          # the MCP server and hang the job. Verified instead by resolving the
          # export target and checking the shebang, which is what actually has
          # to hold for `npx wave-mcp-server` to work.
          PKG_DIR="$SMOKE/node_modules/@wave-av/mcp-server" node --input-type=module -e "
            import fs from 'node:fs';
            const dir=process.env.PKG_DIR;
            const pkg=JSON.parse(fs.readFileSync(dir + '/package.json','utf8'));
            const root=pkg.exports['.'].import;
            const f=dir + '/' + root.replace(/^\.\//,'');
            if(!fs.existsSync(f)){console.error('root export target missing: '+root);process.exit(1);}
            const first=fs.readFileSync(f,'utf8').split('\n')[0];
            if(!first.startsWith('#!')){console.error('root entry is the declared bin but has no shebang');process.exit(1);}
            console.log('root entry ok (executable, not imported):',root);
          "
          # The declared bin actually exists in the packed tree. Read the
          # manifest out of node_modules directly: this package has an
          # `exports` map with no "./package.json" entry, so resolving it as a
          # subpath would throw ERR_PACKAGE_PATH_NOT_EXPORTED.
          PKG_DIR="$SMOKE/node_modules/@wave-av/mcp-server" node -e "
            const fs=require('fs'),path=require('path');
            const dir=process.env.PKG_DIR;
            const pkg=JSON.parse(fs.readFileSync(path.join(dir,'package.json'),'utf8'));
            const bins=typeof pkg.bin==='string'?{[pkg.name]:pkg.bin}:(pkg.bin||{});
            const names=Object.keys(bins);
            if(names.length===0){console.log('no bin declared - nothing to check');process.exit(0);}
            for(const n of names){
              const f=path.join(dir,bins[n]);
              if(!fs.existsSync(f)){console.error('declared bin missing from tarball: '+n+' -> '+bins[n]);process.exit(1);}
              console.log('bin ok:',n,'->',bins[n]);
            }"
          # Declared `types` entry points must exist in the tarball. This was a
          # warning while the build emitted no .d.ts at all; the build now runs
          # `tsc --emitDeclarationOnly` (see tsup.config.ts for why not tsup's
          # dts worker), so a missing declaration is a real regression and fails
          # the gate. A warning nobody reads is how the `bin` defect survived to
          # a published version.
          PKG_DIR="$SMOKE/node_modules/@wave-av/mcp-server" node -e "
            const fs=require('fs'),path=require('path');
            const dir=path.resolve(process.env.PKG_DIR);
            const pkg=JSON.parse(fs.readFileSync(path.join(dir,'package.json'),'utf8'));
            const targets=new Set();
            if(typeof pkg.types==='string')targets.add(pkg.types);
            for(const v of Object.values(pkg.exports||{})){
              if(v&&typeof v==='object'&&typeof v.types==='string')targets.add(v.types);
            }
            if(targets.size===0){
              console.log('::warning title=no types declared::manifest declares no \"types\" entry point - nothing to verify');
              process.exit(0);
            }
            const missing=[];
            for(const t of targets){
              // t comes from the packed manifest; keep it inside the package dir.
              const f=path.resolve(dir,t);
              if(f!==dir&&!f.startsWith(dir+path.sep)){
                console.error('::error title=types entry escapes package::'+t+' resolves outside the package directory');
                process.exit(1);
              }
              if(!fs.existsSync(f))missing.push(t);
            }
            if(missing.length){
              console.error('::error title=declared types missing from tarball::'+missing.join(', ')+' -- package.json advertises TypeScript support but these declarations are not in the tarball; consumers would silently resolve to any');
              process.exit(1);
            }
            console.log('types ok:',[...targets].join(', '));"

  # ---------------------------------------------------------------------------
  # Gate 3 — publish. Runs ONLY if secret-scan + verify are green.
  #
  # Auth: npm OIDC trusted publishing (no long-lived token). The runner mints a
  # short-lived OIDC identity token (id-token: write) and npm (>= 11.5.1)
  # exchanges it for a scoped, single-use publish credential -- provided
  # @wave-av/mcp-server has a Trusted Publisher configured on npmjs.com
  # (org: wave-av, repo: mcp-server, workflow: release.yml). No NPM_TOKEN is used.
  #
  # Until that Trusted Publisher is registered this job fails at the publish
  # step. It previously failed too -- silently, on an empty-string token.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm (gated)
    needs: [secret-scan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # mint the OIDC token npm exchanges for a publish credential
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an older
      # npm. Pinned to an exact version so this privileged job never runs an
      # unvetted npm release with its OIDC publishing credentials, then PROVE
      # the floor is met rather than assuming the upgrade did what it said.
      - name: Upgrade npm to a trusted-publishing-capable CLI (>= 11.5.1)
        run: |
          set -euo pipefail
          npm install -g npm@11.19.0
          NPM_VER="$(npm --version)"
          echo "npm version: $NPM_VER"
          NPM_VER="$NPM_VER" node -e "
            const cur=process.env.NPM_VER.split('.').map(Number), min=[11,5,1];
            for(let i=0;i<3;i++){
              if(cur[i]>min[i]) process.exit(0);
              if(cur[i]<min[i]){console.error('npm '+process.env.NPM_VER+' < 11.5.1 - trusted publishing unavailable');process.exit(1);}
            }"

      - run: npm ci

      # GITHUB_REF_NAME is attacker-influenceable by anyone who can push a tag,
      # so it is read from the environment and never interpolated into the
      # script body.
      - name: Verify tag matches package.json version + choose dist-tag
        id: ver
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_NAME version-from-tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG_NAME implies version $TAG_VERSION but package.json is $PKG_VERSION - refusing to publish a mismatched release"
            exit 1
          fi
          case "$PKG_VERSION" in
            *-*) DIST_TAG=next ;;    # any prerelease (next/rc/beta) - never 'latest'
            *)   DIST_TAG=latest ;;  # stable
          esac
          echo "dist-tag=$DIST_TAG"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      # Primary auth is the OIDC token (id-token: write) exchanged by npm
      # against the Trusted Publisher registered for @wave-av/mcp-server -- NO
      # NODE_AUTH_TOKEN is set for that path. If an NPM_TOKEN repository secret
      # exists (e.g. before the Trusted Publisher is registered, or as a
      # break-glass fallback), it is written to .npmrc as a classic auth token
      # and npm uses it instead; an absent/empty secret never touches .npmrc,
      # so the OIDC path is unaffected. --provenance works either way: it only
      # needs `id-token: write` on this job to mint the sigstore attestation.
      - name: Configure npm auth (NPM_TOKEN fallback only — OIDC trusted publishing needs no config here)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "npm auth: using NPM_TOKEN secret fallback"
          else
            echo "npm auth: no NPM_TOKEN secret set — relying on OIDC trusted publishing"
          fi

      - name: npm publish (OIDC trusted publishing, NPM_TOKEN fallback)
        env:
          DIST_TAG: ${{ steps.ver.outputs.dist_tag }}
        run: |
          set -euo pipefail
          npm publish --access public --provenance --tag "$DIST_TAG"

  # ---------------------------------------------------------------------------
  # Gate 4 — post-publish verification. Proves the version that just left this
  # workflow is actually live and correct on the real registry, not just that
  # `npm publish` returned 0. Installs the published package (not the packed
  # tarball verify already checked) and re-runs the same stdio smoke this repo
  # already trusts for fresh installs (scripts/smoke-mcp.mjs, also used by
  # smoke-install.yml). The live tools/call step is the receipt that the
  # published binary talks to api.wave.online, never the wave.online marketing
  # site — it fails on an HTML response and passes only on a real gateway
  # answer (2xx or a gateway error contract).
  # ---------------------------------------------------------------------------
  verify-publish:
    name: Verify published package (live registry)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Resolve expected version from tag
        id: ver
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: npm view — published version is live on the registry
        env:
          EXPECTED: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            PUBLISHED="$(npm view @wave-av/mcp-server@"$EXPECTED" version 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$EXPECTED" ]; then break; fi
            echo "waiting for the registry to index @wave-av/mcp-server@$EXPECTED (attempt $i)"
            sleep 15
          done
          if [ "$PUBLISHED" != "$EXPECTED" ]; then
            echo "::error::npm view never returned $EXPECTED for @wave-av/mcp-server"
            exit 1
          fi
          echo "npm view: @wave-av/mcp-server@$EXPECTED confirmed live"

      - name: Fresh install from the real registry (not the packed tarball)
        env:
          EXPECTED: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          npm init -y >/dev/null
          npm install "@wave-av/mcp-server@$EXPECTED" --registry=https://registry.npmjs.org
          GOT="$(node node_modules/.bin/wave-mcp-server --version)"
          echo "expected=$EXPECTED got=$GOT"
          test "$GOT" = "$EXPECTED"

      - name: Stdio handshake — tools/list answers over the published binary
        run: |
          cd "$RUNNER_TEMP/verify"
          node "$GITHUB_WORKSPACE/scripts/smoke-mcp.mjs" node_modules/@wave-av/mcp-server/dist/index.js 18

      - name: Live tools/call reaches api.wave.online, never wave.online
        env:
          WAVE_API_KEY: ${{ secrets.WAVE_GATEWAY_API_KEY }}
        run: |
          if [ -z "$WAVE_API_KEY" ]; then
            echo "skipped: WAVE_GATEWAY_API_KEY absent (fork or unset)"
            exit 0
          fi
          cd "$RUNNER_TEMP/verify"
          node "$GITHUB_WORKSPACE/scripts/smoke-mcp.mjs" node_modules/@wave-av/mcp-server/dist/index.js 18 wave_list_streams '{}'

  # ---------------------------------------------------------------------------
  # Gate 5 — create the GitHub Release for this tag. Runs ONLY after
  # verify-publish confirms the version is actually live on npm — a Release
  # is a public claim "this is deployed", so it is never created ahead of that
  # proof. Until this job existed, NO step in this workflow ever created a
  # Release: `releases/latest` stayed pinned to a stale, hand-made v0.1.2 from
  # 2026-04-02 while npm moved on to 0.2.1 and beyond — an older Release
  # advertised as "latest" while a newer version is the one anyone actually
  # gets from `npm install`, exactly the drift VER-001 (source ↔ tag ↔
  # GitHub Release ↔ registry all agree) exists to catch. Modelled on the
  # proven, already-running `release` job in wave-av/sdk-python's release.yml,
  # which creates/edits the Release the same idempotent way
  # (gh release view -> create or edit).
  #
  # Three guards keep the Release honest: (1) the tag must still resolve to
  # this run's commit — `gh release create` would otherwise re-create a deleted
  # tag from the default branch, and a moved tag would bind the Release to a
  # commit that was never published; (2) `*-*` versions go to npm's `next`
  # dist-tag, so the same rule marks the Release `--prerelease` rather than
  # letting an rc be advertised as "latest"; (3) an existing Release is left
  # as-is only when it is actually published (a draft is published in place),
  # and anything other than a confirmed not-found fails instead of racing on
  # to a create. `contents: write` is scoped to ONLY this job — every other job in this
  # workflow stays `contents: read` (or unset, inheriting the top-level read).
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: verify-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Create or update the GitHub Release for this tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Guard 1 — the tag must still point at the commit this run published.
          ref_json="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
          tag_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha')"
          if [ "$(printf '%s' "$ref_json" | jq -r '.object.type')" = "tag" ]; then
            # annotated tag: peel the tag object to the commit it points at
            tag_sha="$(gh api "repos/$REPO/git/tags/$tag_sha" --jq '.object.sha')"
          fi
          if [ "$tag_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::tag $TAG resolves to $tag_sha, not the published commit $EXPECTED_SHA — refusing to create a Release for a moved tag"
            exit 1
          fi

          # Guard 2 — mirror the publish job's dist-tag rule: `*-*` is a prerelease.
          prerelease=false
          case "$TAG" in
            *-*) prerelease=true ;;
          esac

          # Guard 3 — distinguish "no Release yet" from auth / rate-limit / network failures.
          view_err="$(mktemp)"
          if existing="$(gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease 2>"$view_err")"; then
            if [ "$(printf '%s' "$existing" | jq -r '.isDraft')" = "true" ]; then
              echo "::notice::release $TAG exists as a draft — publishing it (prerelease=$prerelease)"
              gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease="$prerelease"
            else
              echo "::notice::release $TAG already exists and is published — leaving it as-is"
            fi
          elif grep -qi 'release not found' "$view_err"; then
            create_args=(--repo "$REPO" --verify-tag --title "$TAG" --generate-notes)
            if [ "$prerelease" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "$TAG" "${create_args[@]}"
          else
            echo "::error::could not determine whether release $TAG exists:"
            cat "$view_err" >&2
            exit 1
          fi
